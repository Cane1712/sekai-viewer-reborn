[settings]
experimental = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
pnpm = "12.9.1"
node = "24"

[hooks]
postinstall = "mise reshim"

[tasks.pnpm-install]
alias = "i"
description = "Install workspace dependencies with pnpm"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Start all app dev servers"
run = "pnpm dev"
depends = ["pnpm-install"]

[tasks.dev-content]
description = "Start content-site on port 4101"
run = "pnpm --filter @apps/content-site dev"
depends = ["pnpm-install"]

[tasks.dev-tools]
description = "Start tools-site on port 4102"
run = "pnpm --filter @apps/tools-site dev"
depends = ["pnpm-install"]

[tasks.dev-media-lab]
description = "Start media-lab-site on port 4103"
run = "pnpm --filter @apps/media-lab-site dev"
depends = ["pnpm-install"]

[tasks.dev-account]
description = "Start account-site on port 4104"
run = "pnpm --filter @apps/account-site dev"
depends = ["pnpm-install"]

[tasks.build]
description = "Build all workspaces"
run = "pnpm build"
depends = ["pnpm-install"]

[tasks.check]
description = "Run workspace checks"
run = "pnpm check"
depends = ["pnpm-install"]

[tasks.lint]
description = "Run workspace lint"
run = "pnpm lint"
depends = ["pnpm-install"]

[tasks.update-sekai-api-sdk]
description = "Regenerate sekai-api SDK from an OpenAPI path or URL"
usage = 'arg "<input>" help="OpenAPI path or URL"'
run = 'pnpm --filter @platform/sekai-api-sdk generate:sdk -- --input "${usage_input?}"'
depends = ["pnpm-install"]

[tasks.update-sekai-master-api-sdk]
description = "Regenerate sekai-master-api SDK from an OpenAPI path or URL"
usage = 'arg "<input>" help="OpenAPI path or URL"'
run = 'pnpm --filter @platform/sekai-master-api-sdk generate:sdk -- --input "${usage_input?}"'
depends = ["pnpm-install"]

[tasks.update-sekai-master-api-sdk-local]
description = "Regenerate sekai-master-api SDK from local OpenAPI URL"
run = "pnpm --filter @platform/sekai-master-api-sdk generate:sdk -- --input \"http://localhost:18080/docs/openapi.json\""
depends = ["pnpm-install"]
